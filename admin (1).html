<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>คำสั่งซื้อ | good hair</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400&family=Noto+Sans+Thai:wght@300;400&family=Noto+Serif+Thai:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Table styles for this page only (style.css is left unchanged) */
    .table-wrap {
      overflow-x: auto;
      background-color: var(--color-white);
      border: var(--line-thin);
      border-radius: var(--radius);
    }

    #ordersTable {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    #ordersTable th,
    #ordersTable td {
      padding: var(--space-2) var(--space-2);
      text-align: left;
      vertical-align: top;
      border-bottom: var(--line-thin);
    }

    #ordersTable thead th {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--color-accent-deep);
      white-space: nowrap;
      border-bottom: var(--line-accent);
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }

    #ordersTable tbody tr:hover {
      background-color: var(--color-cream);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">good hair</a>
      <nav class="nav">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section>
      <div class="container">
        <div class="section-header">
          <span class="eyebrow">Admin</span>
          <h1 style="font-size: clamp(2rem, 4vw, 3rem);">รายการคำสั่งซื้อ</h1>
          <span class="divider"></span>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th>วันเวลา</th>
                <th>ชื่อลูกค้า</th>
                <th>เบอร์โทร/Line</th>
                <th>รายการสินค้า</th>
                <th>จำนวนเงินรวม</th>
                <th>หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <span class="brand">good hair</span>
      <small>&copy; good hair. All rights reserved.</small>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
